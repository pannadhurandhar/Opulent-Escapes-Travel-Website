openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Travel enquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: createTravelEnquiry
      tags: [enquiries]
      summary: Submit a travel enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelEnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelEnquiryResponse"
        "400":
          description: Invalid enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Enquiry could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TravelEnquiryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 30
        destination:
          type: string
          minLength: 2
          maxLength: 120
        travelDates:
          type: string
          maxLength: 120
        travellers:
          type: integer
          minimum: 1
          maximum: 50
        message:
          type: string
          maxLength: 2000
        enquiryType:
          type: string
          enum: [package, custom, contact]
      required:
        - name
        - email
        - phone
        - destination
        - travellers
        - enquiryType
    TravelEnquiryResponse:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [received]
        message:
          type: string
      required:
        - id
        - status
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

